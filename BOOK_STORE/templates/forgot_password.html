<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | BOOK STORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
width:400px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#2c3e50;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

.links{
text-align:center;
margin-top:20px;
}

.links a{
text-decoration:none;
color:#3498db;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<form action="/forgot/password" method="POST">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your registered email"
required>

<button type="submit">

Send OTP

</button>

</form>

<div class="links">

<a href="/user/login">

⬅ Back to Login

</a>

</div>

</div>

</body>
</html>
