<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#1d976c,#93f9b9);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#219150;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    text-decoration:none;
    color:#3498db;
    display:block;
    margin-top:10px;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>OTP Verification</h2>

<p>Enter the OTP sent to your registered email.</p>

<form action="/otp/verify" method="POST">

<label>Enter OTP</label>

<input
type="text"
name="otp"
maxlength="6"
placeholder="Enter 6-digit OTP"
required>

<button type="submit">

Verify OTP

</button>

</form>

<div class="links">

<a href="/forgot/password">

Resend OTP

</a>

<a href="/user/login">

Back to Login

</a>

</div>

</div>

</body>
</html>
