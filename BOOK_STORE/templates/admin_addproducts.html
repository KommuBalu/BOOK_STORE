<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Book | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#2c3e50;
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    color:#f1c40f;
}

header a{
    color:white;
    text-decoration:none;
    background:#3498db;
    padding:10px 20px;
    border-radius:5px;
}

.container{
    width:60%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.container h1{
    text-align:center;
    margin-bottom:25px;
    color:#2c3e50;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:15px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#219150;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#3498db;
    font-weight:bold;
}

</style>

</head>
<body>

<header>

<h2>📚 BOOK STORE</h2>

<a href="/admin/dashboard">Dashboard</a>

</header>

<div class="container">

<h1>Add New Book</h1>

<form action="/admin/addproducts" method="POST" enctype="multipart/form-data">

<div class="form-group">

<label>Book Title</label>

<input
type="text"
name="title"
placeholder="Enter Book Title"
required>

</div>

<div class="form-group">

<label>Author Name</label>

<input
type="text"
name="author"
placeholder="Enter Author Name"
required>

</div>

<div class="form-group">

<label>Category</label>

<select name="category">

<option>Programming</option>

<option>Database</option>

<option>Web Development</option>

<option>Artificial Intelligence</option>

<option>Machine Learning</option>

<option>Python</option>

<option>Java</option>

<option>Data Science</option>

</select>

</div>

<div class="form-group">

<label>Price</label>

<input
type="number"
name="price"
placeholder="Enter Price"
required>

</div>

<div class="form-group">

<label>Stock Quantity</label>

<input
type="number"
name="stock"
placeholder="Enter Stock Quantity"
required>

</div>

<div class="form-group">

<label>Book Description</label>

<textarea
name="description"
rows="5"
placeholder="Enter Description"></textarea>

</div>

<div class="form-group">

<label>Upload Book Image</label>

<input
type="file"
name="image"
accept="image/*">

</div>

<button type="submit">

➕ Add Book

</button>

</form>

<div class="back">

<a href="/admin/dashboard">

⬅ Back to Dashboard

</a>

</div>

</div>

</body>
</html>
