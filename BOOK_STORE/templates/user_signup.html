<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration | BOOK STORE</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:450px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.3);
        }

        h2{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:15px;
        }

        .input-group input:focus{
            border-color:#3498db;
        }

        button{
            width:100%;
            padding:12px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#218838;
        }

        .links{
            text-align:center;
            margin-top:20px;
        }

        .links a{
            text-decoration:none;
            color:#3498db;
            font-weight:bold;
        }

        .links a:hover{
            text-decoration:underline;
        }

        .home{
            text-align:center;
            margin-top:15px;
        }

        .home a{
            text-decoration:none;
            color:#555;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Create Your Account</h2>

<form action="/user/signup" method="POST">

<div class="input-group">
<label>Full Name</label>
<input type="text"
       name="fullname"
       placeholder="Enter Full Name"
       required>
</div>

<div class="input-group">
<label>Username</label>
<input type="text"
       name="username"
       placeholder="Choose Username"
       required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email"
       name="email"
       placeholder="Enter Email"
       required>
</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="tel"
       name="mobile"
       placeholder="Enter Mobile Number"
       required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password"
       name="password"
       placeholder="Enter Password"
       required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password"
       name="confirm_password"
       placeholder="Confirm Password"
       required>
</div>

<button type="submit">
Register
</button>

</form>

<div class="links">

<p>Already have an account?</p>

<a href="/user/login">
Login Here
</a>

</div>

<div class="home">

<a href="/">
⬅ Back to Home
</a>

</div>

</div>

</body>
</html>
