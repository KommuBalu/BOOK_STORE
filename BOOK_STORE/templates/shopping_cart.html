<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#2c3e50;
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    color:#f1c40f;
}

header a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.container{
    width:90%;
    margin:40px auto;
}

.container h1{
    margin-bottom:20px;
    color:#2c3e50;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

th{
    background:#3498db;
    color:white;
    padding:15px;
}

td{
    text-align:center;
    padding:15px;
    border-bottom:1px solid #ddd;
}

img{
    width:80px;
    height:100px;
    object-fit:cover;
    border-radius:5px;
}

.quantity{
    width:60px;
    padding:8px;
    text-align:center;
}

.remove{
    background:#e74c3c;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:5px;
}

.remove:hover{
    background:#c0392b;
}

.summary{
    width:350px;
    margin-top:30px;
    margin-left:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.summary h2{
    margin-bottom:20px;
    color:#2c3e50;
}

.summary p{
    margin:12px 0;
    font-size:18px;
}


.checkout{
    display:block;
    width:100%;
    padding:15px;
    margin-top:20px;
    background:#27ae60;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:5px;
    font-size:18px;
}

.checkout:hover{
    background:#219150;
}

.back{
    margin-top:25px;
}

.back a{
    text-decoration:none;
    color:#3498db;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h2>📚 BOOK STORE</h2>

<div>

<a href="/">Home</a>

<a href="/user/orders">My Orders</a>

<a href="/user/login">Logout</a>

</div>

</header>

<div class="container">

<h1>🛒 Shopping Cart</h1>

<table>

<tr>

<th>Image</th>

<th>Book</th>

<th>Price</th>

<th>Quantity</th>

<th>Total</th>

<th>Remove</th>

</tr>

<tr>

<td>

<img src="{{ url_for('static', filename='images/python.jpg') }}">

</td>

<td>Python Programming</td>

<td>₹499</td>

<td>

<input type="number" class="quantity" value="1" min="1">

</td>

<td>₹499</td>

<td>

<a href="#" class="remove">

Remove

</a>

</td>

</tr>

<tr>

<td>

<img src="{{ url_for('static', filename='images/flask.jpg') }}">

</td>

<td>Flask Development</td>

<td>₹699</td>

<td>

<input type="number" class="quantity" value="2" min="1">

</td>

<td>₹1398</td>

<td>

<a href="#" class="remove">

Remove

</a>

</td>

</tr>

</table>

<div class="summary">

<h2>Order Summary</h2>

<p><strong>Items :</strong> 3</p>

<p><strong>Subtotal :</strong> ₹1897</p>

<p><strong>Delivery :</strong> ₹50</p>

<p><strong>Total :</strong> ₹1947</p>


<a href="{{ url_for('payment') }}" class="checkout">
    Proceed to Checkout
</a>

</div>

<div class="back">

<a href="/">⬅ Continue Shopping</a>

</div>

</div>

</body>
</html>
