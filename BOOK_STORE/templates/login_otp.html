<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.container{

    width:430px;
    background:white;
    border-radius:18px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:fade .6s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

    text-align:center;
    font-size:60px;
    margin-bottom:10px;

}

h2{

    text-align:center;
    color:#2c3e50;
    margin-bottom:10px;

}

p{

    text-align:center;
    color:#666;
    margin-bottom:30px;
    line-height:24px;

}

.input-box{

    margin-bottom:25px;

}

.input-box input{

    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:20px;
    text-align:center;
    letter-spacing:8px;
    outline:none;
    transition:.3s;

}

.input-box input:focus{

    border-color:#3498db;
    box-shadow:0 0 10px rgba(52,152,219,.4);

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#3498db;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#2980b9;

}

.links{

    margin-top:25px;
    text-align:center;

}

.links a{

    text-decoration:none;
    color:#3498db;

}

.links a:hover{

    text-decoration:underline;

}

.timer{

    margin-top:20px;
    text-align:center;
    color:red;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
📚
</div>

<h2>Email Verification</h2>

<p>

We have sent a <b>6-digit OTP</b><br>

to your registered email address.

</p>

<form method="POST">

<div class="input-box">

<input
type="text"
name="otp"
maxlength="6"
placeholder="------"
required>

</div>

<button type="submit">

Verify OTP

</button>

</form>

<div class="timer">

OTP expires in <span id="count">120</span> seconds

</div>

<div class="links">

<a href="/user/login">

⬅ Back to Login

</a>

</div>

</div>

<script>

let time=120;

let counter=document.getElementById("count");

setInterval(function(){

if(time>0){

time--;

counter.innerHTML=time;

}

},1000);

</script>

</body>
</html>
