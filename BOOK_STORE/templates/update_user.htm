<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Profile | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#2c3e50;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#3498db;
}

button{
    width:100%;
    padding:14px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1f8a4d;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#3498db;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Update Profile</h2>

<form action="/update/profile" method="POST">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="fullname"
placeholder="Enter Full Name"
required>

</div>

<div class="form-group">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

</div>

<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

</div>

<div class="form-group">

<label>Mobile Number</label>

<input
type="tel"
name="mobile"
placeholder="Enter Mobile Number"
required>

</div>

<div class="form-group">

<label>New Password</label>

<input
type="password"
name="password"
placeholder="Enter New Password">

</div>

<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm New Password">

</div>

<button type="submit">

Update Profile

</button>

</form>

<div class="links">

<p>

<a href="/">🏠 Home</a>

&nbsp;&nbsp;|&nbsp;&nbsp;

<a href="/user/orders">📦 My Orders</a>

</p>

</div>

</div>

</body>
</html>
