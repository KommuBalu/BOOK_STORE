<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment | BOOK STORE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    width:450px;
    margin:50px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

label{
    display:block;
    margin:10px 0;
    font-size:18px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#219150;
}
</style>

</head>
<body>

<div class="container">

<h2>Choose Payment Method</h2>

<form action="/payment" method="POST">

<label><input type="radio" name="payment" value="UPI" required> UPI</label>

<label><input type="radio" name="payment" value="Credit Card"> Credit Card</label>

<label><input type="radio" name="payment" value="Debit Card"> Debit Card</label>

<label><input type="radio" name="payment" value="Net Banking"> Net Banking</label>

<label><input type="radio" name="payment" value="Cash On Delivery"> Cash On Delivery</label>

<button type="submit">
Pay Now
</button>

</form>

</div>

</body>
</html>
