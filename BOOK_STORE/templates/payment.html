<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment | BOOK STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

}

.container{

    width:900px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 50px rgba(0,0,0,.3);

}

.left{

    width:45%;
    background:#0d47a1;
    color:white;
    padding:40px;

}

.left h1{

    margin-bottom:15px;
    font-size:34px;

}

.left p{

    line-height:28px;
    opacity:.9;

}

.security{

    margin-top:40px;

}

.security div{

    margin:15px 0;
    font-size:18px;

}

.right{

    width:55%;
    padding:40px;

}

.right h2{

    color:#333;
    margin-bottom:30px;

}

.summary{

    background:#f5f5f5;
    border-radius:12px;
    padding:20px;
    margin-bottom:30px;

}

.summary h3{

    margin-bottom:15px;

}

.row{

    display:flex;
    justify-content:space-between;
    margin:12px 0;

}

.total{

    margin-top:20px;
    padding-top:20px;
    border-top:2px dashed #ccc;
    font-size:22px;
    font-weight:bold;
    color:#27ae60;

}

button{

    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#3399cc;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#2874f0;

}

.footer{

    margin-top:25px;
    text-align:center;
    color:#777;
    font-size:14px;

}

img{

    width:100%;
    margin-top:30px;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>📚 BOOK STORE</h1>

<p>

Complete your payment securely using Razorpay.

</p>

<div class="security">

<div>🔒 256-bit SSL Secure</div>

<div>💳 Cards • UPI • Wallets</div>

<div>🏦 Net Banking</div>

<div>⚡ Fast Checkout</div>

<div>✅ Trusted by Millions</div>

</div>

</div>

<div class="right">

<h2>Order Summary</h2>

<div class="summary">

<div class="row">

<span>Total Books</span>

<span>{{ cart|length }}</span>

</div>

<div class="row">

<span>Delivery</span>

<span>FREE</span>

</div>

<div class="row total">

<span>Total</span>

<span>₹{{ amount }}</span>

</div>

</div>

<button id="rzp-button">

🔒 Pay Securely with Razorpay

</button>

<div class="footer">

Powered by Razorpay Secure Payment Gateway

</div>

</div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

"key":"{{ razorpay_key }}",

"amount":"{{ amount*100 }}",

"currency":"INR",

"name":"BOOK STORE",

"description":"Online Book Purchase",

"image":"https://cdn-icons-png.flaticon.com/512/2232/2232688.png",

"order_id":"{{ order_id }}",

"handler":function(response){

window.location.href="/payment/success";

},

"prefill":{

"name":"Customer",

"email":"customer@gmail.com",

"contact":"9999999999"

},

"theme":{

"color":"#2874f0"

}

};

var rzp=new Razorpay(options);

document.getElementById("rzp-button").onclick=function(e){

rzp.open();

e.preventDefault();

}

</script>

</body>
</html>
